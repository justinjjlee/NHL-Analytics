name: Sync to Hugging Face Dataset

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target domain to synchronize'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - box
          - odds
          - player
      force:
        description: 'Force upload even if no changes are detected'
        required: false
        default: false
        type: boolean
      season:
        description: 'Specific season year to process (leave blank for active season)'
        required: false
        default: ''
        type: string

jobs:
  sync-dataset:
    runs-on: ubuntu-latest
    environment: data-collection

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements/requirements.txt

      - name: Run Hugging Face Dataset Synchronization
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Error: HF_TOKEN secret is required but not configured in repository secrets."
            exit 1
          fi
          CMD="python deploy/huggingface/sync_dataset.py --repo 'jjerlee/nhl-analytics' --target '${{ inputs.target }}'"
          if [ "${{ inputs.force }}" = "true" ]; then
            CMD="$CMD --force"
          fi
          if [ -n "${{ inputs.season }}" ]; then
            CMD="$CMD --season ${{ inputs.season }}"
          fi
          echo "Executing: $CMD"
          eval $CMD
