name: NHL API pull data for game-level stats (box, plays, shifts, and summaries)

on:
  schedule:
    # Runs daily at 09:00 UTC (3:00 AM CST / 4:00 AM CDT), ensuring all late games have concluded
    # Only in hockey season months (January to June and September to December)
    - cron: '0 9 * 1-6,9-12 *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-and-commit:
    runs-on: ubuntu-latest
    environment: data-collection

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements/requirements.txt

    - name: Run NHL Game Record Data
      run: python src/data/apinhle/data_pull_box.py

    - name: Run NHL Game-level Summary to Game Records and Season-team Statistics
      if: always()
      run: python src/data/apinhle/data_proc_gameSummary.py

    - name: Run NHL Game-level Play-by-play record data
      if: always()
      run: python src/data/apinhle/data_pull_plays.py

    - name: Run NHL Game-level Play-by-play Shift record data
      if: always()
      run: python src/data/apinhle/data_pull_lines.py

    - name: Run NHL Line Shift and L5 Trend Analytics
      if: always()
      run: python src/data/apinhle/data_proc_shifts.py

    - name: Run NHL Physical Hits and Sequence Analytics
      if: always()
      run: python src/data/apinhle/data_proc_hits.py --incremental

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Commit and push changes
      run: |
        git add latest/box/*.csv
        git add latest/team/season/*.csv
        git add latest/play/*.csv
        git add latest/action/hits/*.csv
        git add latest/action/shifts/*.csv
        git add app/data/hit_eda/*.csv
        git add dev/decision_science/impact_of_hits/data/*.csv
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        else
          git checkout -- .
          git commit -m 'Automated data update (game stats)'
          git pull --rebase --autostash origin main
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync updated game records and statistics to Hugging Face Dataset
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        if [ -z "$HF_TOKEN" ]; then
          echo "HF_TOKEN secret not configured, skipping Hugging Face dataset sync."
          exit 0
        fi
        python deploy/huggingface/sync_dataset.py --repo "jjerlee/nhl-analytics" --target box

    - name: Synthesize Editorial Game Recaps & Sync to Hugging Face Dataset
      if: always()
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        if [ -z "$HF_TOKEN" ]; then
          echo "HF_TOKEN secret not configured, skipping recaps generation."
          exit 0
        fi
        python dev/agent/scoreboard/cli.py --latest --record-hf --no-save

