name: NHL API pull data for game-level stats (box, plays, and summaries)

on:
  schedule:
    # Runs daily at 09:00 UTC (3:00 AM CST / 4:00 AM CDT), ensuring all late games have concluded
    # Only in hockey season months (January to June and September to December)
    - cron: '0 9 * 1-6,9-12 *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-and-commit:
    runs-on: ubuntu-latest
    environment: data-collection

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements/requirements.txt

    - name: Run NHL Game Record Data
      run: python src/data/apinhle/data_pull_box.py

    - name: Run NHL Game-level Summary to Game Records and Season-team Statistics
      if: always()
      run: python src/data/apinhle/data_proc_gameSummary.py

    - name: Run NHL Game-level Play-by-play record data
      if: always()
      run: python src/data/apinhle/data_pull_plays.py

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Commit and push changes
      run: |
        git add latest/box/*.csv
        git add latest/team/season/*.csv
        git add latest/play/*.csv 
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        else
          git checkout -- .
          git commit -m 'Automated data update (game stats)'
          git pull --rebase --autostash origin main
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
