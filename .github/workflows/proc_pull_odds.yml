name: NHL API pull data for betting odds

on:
  schedule:
    # Runs daily at 20:00 UTC (3:00 PM CDT / 2:00 PM CST), before evening games start
    # Only in hockey season months (January to June and September to December)
    - cron: '0 20 * 1-6,9-12 *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-and-commit:
    runs-on: ubuntu-latest
    environment: data-collection

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements/requirements.txt

    - name: Run NHL Odds Data
      run: python src/data/apinhle/data_pull_box_odds.py

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Commit and push changes
      run: |
        git add latest/box/*_odds_*.csv
        git add latest/box/*_odds_*.json
        if git diff-index --quiet HEAD --; then
          echo "No changes to commit"
          exit 0
        else
          git commit -m 'Automated data update (betting odds)'
          git pull --rebase origin main
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
